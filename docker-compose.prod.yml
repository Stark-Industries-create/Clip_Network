services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clipnetwork}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-clipnetwork}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clipnetwork} -d ${POSTGRES_DB:-clipnetwork}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: elestio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    # Only the host's TLS edge (Caddy) reaches MinIO; it serves signed clip URLs on the media domain.
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      # Browsers upload source files straight to storage with signed URLs from the app's origin.
      MINIO_API_CORS_ALLOW_ORIGIN: ${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Creates the private media bucket once; safe to re-run.
  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-clip-network-media}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" >/dev/null &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        mc anonymous set none "local/$$S3_BUCKET"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        PRISMA_SCHEMA: prisma/schema.postgresql.prisma
    restart: unless-stopped
    command: ["sh", "-ec", "cd /app/apps/api && node node_modules/prisma/build/index.js migrate deploy --schema=prisma/schema.postgresql.prisma && exec node dist/index.js"]
    environment:
      NODE_ENV: production
      PORT: 4100
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}
      # Public origin of the API (same domain as the app; nginx serves /api). Used for the Stripe webhook URL.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-${PUBLIC_APP_URL}}
      # Caddy and nginx sit in front of the API.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
      X_CLIENT_ID: ${X_CLIENT_ID:-}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?ENCRYPTION_MASTER_KEY is required}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Clip Network <noreply@clipnetwork.io>}
      POSTIZ_YOUTUBE_MADE_FOR_KIDS: ${POSTIZ_YOUTUBE_MADE_FOR_KIDS:-}
      POSTIZ_INSTAGRAM_WORKSPACE_ID: ${POSTIZ_INSTAGRAM_WORKSPACE_ID:-}
      POSTIZ_FRONTEND_URL: ${POSTIZ_FRONTEND_URL:-https://platform.postiz.com}
      INSTAGRAM_CLIENT_ID: ${INSTAGRAM_CLIENT_ID:-}
      INSTAGRAM_CLIENT_SECRET: ${INSTAGRAM_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      TIKTOK_CLIENT_ID: ${TIKTOK_CLIENT_ID:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      YOUTUBE_MADE_FOR_KIDS: ${YOUTUBE_MADE_FOR_KIDS:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-}
      POSTIZ_API_KEY: ${POSTIZ_API_KEY:-}
      POSTIZ_API_BASE_URL: ${POSTIZ_API_BASE_URL:-https://api.postiz.com/public/v1}
      S3_ENDPOINT: ${S3_ENDPOINT:?Set a browser-reachable S3 endpoint}
      S3_BUCKET: ${S3_BUCKET:-clip-network-media}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      SOURCE_CONNECTOR_WORKSPACE_ID: ${SOURCE_CONNECTOR_WORKSPACE_ID:-}
      SOURCE_CONNECTOR_INGRESS_TOKEN: ${SOURCE_CONNECTOR_INGRESS_TOKEN:-}
      CHANNEL_MONITOR_INTERVAL_MS: "0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4100/api/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: inference
      args:
        PRISMA_SCHEMA: prisma/schema.postgresql.prisma
    restart: unless-stopped
    command: ["node", "apps/api/dist/worker.js"]
    stop_grace_period: 10m
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs'); const m=fs.statSync('/tmp/clip-network-worker-heartbeat').mtimeMs; if(Date.now()-m>Math.max(600000,3*Number(process.env.CHANNEL_MONITOR_INTERVAL_MS||300000))) process.exit(1)"]
      interval: 30s
      timeout: 5s
      start_period: 10m
      retries: 3
    environment:
      NODE_ENV: production
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?ENCRYPTION_MASTER_KEY is required}
      X_CLIENT_ID: ${X_CLIENT_ID:-}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET:-}
      POSTIZ_YOUTUBE_MADE_FOR_KIDS: ${POSTIZ_YOUTUBE_MADE_FOR_KIDS:-}
      INSTAGRAM_CLIENT_ID: ${INSTAGRAM_CLIENT_ID:-}
      INSTAGRAM_CLIENT_SECRET: ${INSTAGRAM_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      TIKTOK_CLIENT_ID: ${TIKTOK_CLIENT_ID:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      YOUTUBE_MADE_FOR_KIDS: ${YOUTUBE_MADE_FOR_KIDS:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-}
      POSTIZ_API_KEY: ${POSTIZ_API_KEY:-}
      POSTIZ_API_BASE_URL: ${POSTIZ_API_BASE_URL:-https://api.postiz.com/public/v1}
      S3_ENDPOINT: ${S3_ENDPOINT:?Set a browser-reachable S3 endpoint}
      S3_BUCKET: ${S3_BUCKET:-clip-network-media}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      SOURCE_CONNECTOR_WORKSPACE_ID: ${SOURCE_CONNECTOR_WORKSPACE_ID:-}
      SOURCE_CONNECTOR_SUBSCRIPTIONS_URL: ${SOURCE_CONNECTOR_SUBSCRIPTIONS_URL:-}
      SOURCE_CONNECTOR_ADMIN_TOKEN: ${SOURCE_CONNECTOR_ADMIN_TOKEN:-}
      SOURCE_AUTOMATION_ENABLED: ${SOURCE_AUTOMATION_ENABLED:-false}
      RECORDING_WHISPER_MODEL: ${RECORDING_WHISPER_MODEL:-/opt/clip-models/base.bin}
      TRANSCRIPTION_API_URL: ${TRANSCRIPTION_API_URL:-}
      TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_API_KEY:-}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-whisper-large-v3-turbo}
      HIGHLIGHT_LLM_URL: ${HIGHLIGHT_LLM_URL:-}
      HIGHLIGHT_LLM_API_KEY: ${HIGHLIGHT_LLM_API_KEY:-}
      HIGHLIGHT_LLM_MODEL: ${HIGHLIGHT_LLM_MODEL:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      DISCOVERY_CONCURRENCY: ${DISCOVERY_CONCURRENCY:-4}
      AUTO_PUBLISH_DISABLED: ${AUTO_PUBLISH_DISABLED:-false}
      CHANNEL_MONITOR_INTERVAL_MS: ${CHANNEL_MONITOR_INTERVAL_MS:-300000}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # nginx serves the API under /api on the app's own domain.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-${PUBLIC_APP_URL}}
        NEXT_PUBLIC_LEGAL_EMAIL: ${NEXT_PUBLIC_LEGAL_EMAIL:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/"]
      interval: 15s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:

name: Deploy

# Ships main to the production VPS after CI passes on it, or on demand from the Actions tab.
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   VPS_HOST         server IP or hostname
#   VPS_SSH_KEY      private key of a deploy key pair whose public key is in the server's authorized_keys
#   VPS_KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 <VPS_HOST>`, so the server's identity is pinned
# Optional repository variables: VPS_USER (default root), APP_DIR (default /opt/clip-network),
# APP_URL (for example https://app.example.com, checked after deploying).
# Until the secrets exist the workflow reports that deployment is not configured and succeeds.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Add required reviewers to this environment (Settings > Environments) to approve each deploy.
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || 'root' }}
      APP_DIR: ${{ vars.APP_DIR || '/opt/clip-network' }}
      APP_URL: ${{ vars.APP_URL }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check deployment settings
        id: config
        env:
          HAS_KEY: ${{ secrets.VPS_SSH_KEY != '' }}
          HAS_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS != '' }}
        run: |
          if [ -z "$VPS_HOST" ] || [ "$HAS_KEY" != "true" ] || [ "$HAS_HOSTS" != "true" ]; then
            echo "::notice::Deployment is not configured yet. Add VPS_HOST, VPS_SSH_KEY and VPS_KNOWN_HOSTS secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.config.outputs.ready == 'true'
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy ${{ env.DEPLOY_SHA }}
        if: steps.config.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "$VPS_USER@$VPS_HOST" bash -s -- "$APP_DIR" "$DEPLOY_SHA" <<'REMOTE'
          set -euo pipefail
          APP_DIR="$1"; SHA="$2"
          cd "$APP_DIR"
          # Deploy exactly the commit CI tested; refuses anything that is not a fast-forward.
          git fetch --quiet origin main
          git merge --ff-only "$SHA"
          bash deploy/deploy.sh --no-pull
          REMOTE

      - name: Check the live site
        if: steps.config.outputs.ready == 'true' && env.APP_URL != ''
        run: |
          for _ in $(seq 1 20); do
            if curl -fsS "$APP_URL/api/readyz" >/dev/null; then echo "Live: $APP_URL"; exit 0; fi
            sleep 6
          done
          echo "::error::$APP_URL/api/readyz did not answer after deploying."
          exit 1

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
